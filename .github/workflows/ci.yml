name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo run -q -p urouter-catalog -- --json check catalog/catalog.json
      - name: Check pricing fixture size
        shell: pwsh
        run: |
          $vectors = Get-Content -Raw catalog/fixtures/pricing-golden.json | ConvertFrom-Json
          if ($vectors.Count -lt 30) { throw "pricing fixture must contain at least 30 vectors" }
      - name: Check tracked files for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
      - name: Enforce pure-crate dependency boundary
        shell: pwsh
        run: ./scripts/check-pure-crates.ps1

  catalog-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Catalog semantic diff
        run: |
          git show "${{ github.event.pull_request.base.sha }}:catalog/catalog.json" > /tmp/base-catalog.json
          cargo run -q -p urouter-catalog -- --json diff /tmp/base-catalog.json catalog/catalog.json

  p2-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Redis restart and upstream failure gates
        shell: pwsh
        run: ./scripts/run-p2-chaos.ps1
      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-chaos-report
          path: target/p2-chaos-report.json
