name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The toolchain and its components come from rust-toolchain.toml so that
      # CI and local release-gate runs are byte-identical.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo run -q -p urouter-catalog -- --json check catalog/catalog.json
      - name: Check pricing fixture size
        run: cargo run -q -p urouter-xtask -- check-pricing-fixture
      - name: Check tracked files for secrets
        run: cargo run -q -p urouter-xtask -- check-secrets
      - name: Enforce pure-crate dependency boundary
        run: cargo run -q -p urouter-xtask -- check-pure-crates
      - name: Validate shipped deployment manifests
        run: cargo run -q -p urouter-xtask -- check-deploy

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Advisories, licenses, banned packages and source registries; policy and
      # the reasoning behind each exception live in deny.toml.
      - run: cargo deny check

  redis-contracts:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UROUTER_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      # Without UROUTER_TEST_REDIS_URL these contracts are silently ignored, so
      # the multi-instance state guarantees would never actually be exercised.
      - name: Redis-backed state contracts
        run: |
          cargo test -p urouter-gateway --lib -- --ignored
          cargo test -p urouter-gateway --bin urouter-gateway -- --ignored

  catalog-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Catalog semantic diff
        run: |
          git show "${{ github.event.pull_request.base.sha }}:catalog/catalog.json" > /tmp/base-catalog.json
          cargo run -q -p urouter-catalog -- --json diff /tmp/base-catalog.json catalog/catalog.json

  p2-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Run Redis restart and upstream failure gates
        run: cargo run -q -p urouter-xtask -- chaos
      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-chaos-report
          path: target/p2-chaos-report.json
