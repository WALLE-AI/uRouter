[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "urouter-py"
version = "0.1.0"
requires-python = ">=3.10"
description = "Shared uRouter feature extraction and exact pricing bindings"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "urouter_py"
