[package]
name = "urouter-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not part of the published surface in docs/public-api-and-semver.md:
# distributed as a Python wheel via maturin, not on crates.io.
publish = false
description = "Python bindings for uRouter feature extraction and exact pricing"

[lib]
name = "urouter_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
serde_json.workspace = true
thiserror.workspace = true
urouter-ai = { version = "0.1.0", path = "../urouter-ai" }
urouter-contracts = { version = "0.1.0", path = "../urouter-contracts" }
urouter-types = { version = "0.1.0", path = "../urouter-types" }

[lints]
workspace = true
