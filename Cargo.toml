[workspace]
members = [
    "crates/urouter-types",
    "crates/urouter-contracts",
    "crates/urouter-ai",
    "crates/urouter-eval",
    "crates/urouter-artifact",
    "crates/urouter-protocol",
    "crates/urouter-client",
    "crates/urouter-embed",
    "crates/urouter-gateway",
    "tools/urouter-catalog",
    "tools/urouter-smoke",
    "tools/urouter-soak",
    "tools/urouter-lab",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "0.32", default-features = false, features = ["aio", "connection-manager", "script", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
